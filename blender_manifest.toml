# blender_manifest.toml
# Manifest file for the BL Perspective Transform Extension

# Blender Extension Manifest
schema_version = "1.0.0"
id = "BL_PerspectiveTransform"
version = "2.2.3"

name = "BL Perspective Transform"
tagline = "Corner-pin perspective distortion for the VSE preview"
type = "add-on"

# Author and maintainer info
author = "usrname0"
maintainer = "usrname0"

# Links
website = "https://github.com/usrname0/BL_PerspectiveTransform"

# Tags for discoverability
tags = ["Sequencer"]

# Requirements
blender_version_min = "5.0.0"

# License - must be GPL compatible
license = ["SPDX:GPL-3.0-or-later"]

# Description - must be clear about all functionality
description = """A corner-pin perspective transform for Blender's Video Sequence Editor.

Drag the four corners of a strip in the preview to distort it. The result will render accordingly.

Features:
- Four draggable corner handles in the VSE preview
- Renders as part of Blender's normal strip pipeline
- Works with any visual strip: image, movie, text, color, scene, etc.
- Correct alongside the strip's own scale, rotation, mirror and crop
- Every corner can be keyframed
- Select the tool via toolbar, menu or shortcut (default "P")

Stores the transform as a Corner Pin node in a compositor strip modifier, so it requires Blender 5.0 or newer.
"""

# Copyright notices
copyright = [
    "2026 usrname0",
]

# Build configuration
[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    ".*",
    "/.git/",
    "/.gitignore",
    "/.github/",
    "/icons/*.png",
    "/icons/*.svg",
    "/icons/*.blend",
    "/icons/*.blend1",
    "/icons/Blender_export_dat.py",
    "/docs/",
    "/tests/",
    "/*.md",
    "/*.zip",
    "/zips/",
    "/.vscode/",
    "/examples/",
]